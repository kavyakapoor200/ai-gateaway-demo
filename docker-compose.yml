services:
  # ----------------------------------------------------------------------------
  # 1. LiteLLM Core AI Gateway Proxy
  # ----------------------------------------------------------------------------
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    container_name: litellm_gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-enterprise-master-secret-key-2026}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_OTEL_V2=true
      - OTEL_EXPORTER=otlp_http
      - OTEL_ENDPOINT=http://jaeger:4318/v1/traces
      - OTEL_SERVICE_NAME=litellm
      - OTEL_BSP_SCHEDULE_DELAY_MILLIS=500
      - DB_PATH=/app/data/gateway.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway_data:/app/data
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    depends_on:
      - redis
      - postgres
      - jaeger
      - mock_upstream

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 16 (Required for LiteLLM Prisma Key Management & User Roles)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gateway_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=litellm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ----------------------------------------------------------------------------
  # 3. Redis 7 (Rate Limiting, Real-Time Budgets & Hashed Branch Registry)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gateway_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  # ----------------------------------------------------------------------------
  # 4. Jaeger All-in-One (OTel Trace Collector & Flow UI)
  # ----------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gateway_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI (http://localhost:16686)
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ----------------------------------------------------------------------------
  # 5. CPS Git Merge Lifecycle Webhook Service
  # ----------------------------------------------------------------------------
  cps_webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    container_name: gateway_cps_webhook
    restart: unless-stopped
    working_dir: /app
    volumes:
      - gateway_data:/app/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_PATH=/app/data/gateway.db
      - WEBHOOK_PORT=4001
    command: ["python", "-u", "cps_webhook_server.py"]
    ports:
      - "4001:4001"
    depends_on:
      - redis

  # ----------------------------------------------------------------------------
  # 6. Zero-Cost Mock Upstream LLM Server
  # ----------------------------------------------------------------------------
  mock_upstream:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: gateway_mock_upstream
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "mock_upstream_server.py", "--port", "8080", "--host", "0.0.0.0"]
    ports:
      - "8088:8080"

  # ----------------------------------------------------------------------------
  # 7. Prometheus (Metrics Scraper & Timeseries Storage)
  # ----------------------------------------------------------------------------
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: gateway_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - litellm
      - cps_webhook

  # ----------------------------------------------------------------------------
  # 8. Grafana (Visualization Console)
  # ----------------------------------------------------------------------------
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    container_name: gateway_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
  gateway_data:

